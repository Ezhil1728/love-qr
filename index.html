<!DOCTYPE html>
<html>
<head>
  <title>For You Chellameyyy ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #ffe6eb;
      margin: 0;
      padding: 20px;
    }

    h2 {
      color: #e6005c;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .content {
      margin-top: 20px;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      background: #ff4d88;
      color: white;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h2>Choose an Envelope 💌</h2>

<div class="container">

  <div class="card" onclick="showContent('memories')">
    Our Memories
  </div>

  <div class="card" onclick="showContent('letter')">
    My Letter
  </div>

  <div class="card" onclick="showContent('love')">
    Why I Love You
  </div>

  <div class="card" onclick="showContent('date')">
    Date Night?
  </div>

</div>

<div id="contentBox" class="content hidden"></div>

<script>
function showContent(type) {
  let content = "";

  if(type === "memories") {
  content = `
    <h3>Our Memories 📸</h3>

    <div class="slideshow">
      <img id="slide" src="img1.jpg" width="100%" style="border-radius:10px;">
      <img id="slide" src="img2.jpg" width="100%" style="border-radius:10px;">
      <img id="slide" src="img3.jpg" width="100%" style="border-radius:10px;">
      <img id="slide" src="img4.jpg" width="100%" style="border-radius:10px;">
      <img id="slide" src="img5.jpg" width="100%" style="border-radius:10px;">
      <img id="slide" src="img6.jpg" width="100%" style="border-radius:10px;">
    </div>

    <br>

    <button onclick="prevSlide()">⬅️</button>
    <button onclick="nextSlide()">➡️</button>
  `;
}

  if(type === "letter") {
    content = `
      <h3>My Letter 💌</h3>
      <p>
      I just want to say... you are the best thing in my life ❤️
      </p>
      <!-- EDIT YOUR LETTER HERE -->
    `;
  }

  if(type === "love") {
    content = `
      <h3>Why I Love You ❤️</h3>
      <ul>
        <li>Your smile 😊</li>
        <li>Your care 💕</li>
        <li>Your support 🤗</li>
      </ul>
      <!-- EDIT REASONS HERE -->
    `;
  }

  if(type === "date") {
    content = `
      <h3>Date Night? 🍽️</h3>
      <p>Let's go out this weekend ❤️</p>
      <button onclick="alert('She said YES 💖')">Accept</button>
      <!-- CHANGE MESSAGE HERE -->
    `;
  }

  document.getElementById("contentBox").innerHTML = content;
  document.getElementById("contentBox").classList.remove("hidden");
    
}
</script>
<script>
let images = [
  "img1.jpg",
  "img2.jpg",
  "img3.jpg",
  "img4.jpg",
  "img5.jpg",
  "img6.jpg"
]; // 👉 ADD YOUR IMAGE NAMES HERE

let index = 0;

function showSlide() {
  document.getElementById("slide").src = images[index];
}

function nextSlide() {
  index = (index + 1) % images.length;
  showSlide();
}

function prevSlide() {
  index = (index - 1 + images.length) % images.length;
  showSlide();
}
</script>

</body>
</html>
