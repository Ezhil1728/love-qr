<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Love Story</title>
    <style>
        :root {
            --primary-pink: #fce4ec;
            --accent-red: #d81b60;
            --text-gray: #4a4a4a;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--primary-pink);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-gray);
        }

        .container {
            background: white;
            width: 90%;
            max-width: 400px;
            border-radius: 25px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h1 { font-size: 24px; color: var(--accent-red); margin-bottom: 10px; }
        p.subtitle { font-size: 14px; margin-bottom: 30px; opacity: 0.8; }

        /* The Grid Layout */
        .envelope-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: #fffafa;
            border: 1.5px solid #f8bbd0;
            border-radius: 15px;
            padding: 20px 10px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            text-decoration: none;
            color: inherit;
        }

        .card:active { transform: scale(0.95); background: #fce4ec; }

        .icon { font-size: 30px; margin-bottom: 10px; display: block; }
        .label { font-size: 14px; font-weight: 600; }

        /* Modal / Detail View Styling */
        #detail-view {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .back-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container" id="main-menu">
        <h1>Choose an envelope</h1>
        <p class="subtitle">Explore the little things I love about us.</p>
        
        <div class="envelope-grid">
            <div class="card" onclick="showContent('memories')">
                <span class="icon">🖼️</span>
                <span class="label">Our Memories</span>
            </div>
            <div class="card" onclick="showContent('letter')">
                <span class="icon">✉️</span>
                <span class="label">My Letter</span>
            </div>
            <div class="card" onclick="showContent('why')">
                <span class="icon">❤️</span>
                <span class="label">Why I Love You</span>
            </div>
            <div class="card" onclick="showContent('date')">
                <span class="icon">📅</span>
                <span class="label">Date Night?</span>
            </div>
        </div>
    </div>

    <div id="detail-view">
        <div id="content-area"></div>
        <button class="back-btn" onclick="hideContent()">Back</button>
    </div>

    <script>
        const contents = {
            memories: `<h2>Our Memories</h2><p>Remember that time we...</p><img src="https://via.placeholder.com/300" style="width:100%; border-radius:15px;"><p>Insert your photos here!</p>`,
            letter: `<h2>My Dear...</h2><p style="text-align:left; line-height:1.6;">Writing this to tell you how much you mean to me. Every day with you is a gift...</p>`,
            why: `<h2>Why I Love You</h2><ul style="text-align:left;"><li>Your laugh.</li><li>How you care for others.</li><li>The way you look at me.</li></ul>`,
            date: `<h2>Date Night?</h2><p>Pick one for this weekend:</p><button onclick="alert('Sushi it is!')">🍣 Sushi Night</button><br><br><button onclick="alert('Movie time!')">🎬 Cinema</button>`
        };

        function showContent(type) {
            document.getElementById('content-area').innerHTML = contents[type];
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('main-menu').style.display = 'none';
        }

        function hideContent() {
            document.getElementById('detail-view').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        }
    </script>
</body>
</html>
