<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A Special Surprise</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --soft-pink: #fff0f3;
            --heart-red: #ff4d6d;
            --dark-pink: #590d22;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0; padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--soft-pink);
            color: var(--dark-pink);
            display: flex; justify-content: center;
        }

        .phone-container {
            width: 100%; max-width: 450px; min-height: 100vh;
            padding: 20px; display: flex; flex-direction: column; align-items: center;
        }

        header { text-align: center; margin-top: 40px; margin-bottom: 30px; }
        header h1 { font-family: 'Dancing Script', cursive; font-size: 38px; color: var(--heart-red); margin: 0; }

        /* The Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .card {
            background: white; border-radius: 20px; padding: 30px 10px;
            text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            transition: 0.3s; border: 1px solid #ffccd5; cursor: pointer;
        }
        .card:active { transform: scale(0.95); }
        .icon { font-size: 35px; display: block; margin-bottom: 10px; }
        .label { font-size: 13px; font-weight: 600; }

        /* Overlay */
        .overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 1000; padding: 30px; overflow-y: auto;
        }
        .overlay-content { max-width: 400px; margin: 0 auto; text-align: center; }
        .back-btn {
            background: var(--heart-red); color: white; border: none;
            padding: 12px 30px; border-radius: 50px; margin-top: 30px; font-weight: bold;
        }

        /* Proposal Section */
        .proposal-box { padding: 20px; }
        .btn-wrap { display: flex; justify-content: center; gap: 20px; margin-top: 30px; position: relative; height: 100px; }
        #yesBtn { background: #4CAF50; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; }
        #noBtn { background: #f44336; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; position: absolute; transition: 0.2s; }
        
        .success-msg { display: none; text-align: center; }
        .success-msg h2 { color: var(--heart-red); font-size: 40px; }
    </style>
</head>
<body>

    <div class="phone-container">
        <header>
            <div style="font-size: 50px;">❤️</div>
            <h1>Choose an envelope</h1>
            <p>Explore the little things I love about us.</p>
        </header>

        <div class="grid">
            <div class="card" onclick="openBox('memories')">
                <span class="icon">🖼️</span>
                <span class="label">Beautiful Memories</span>
            </div>
            <div class="card" onclick="openBox('letter')">
                <span class="icon">✉️</span>
                <span class="label">My Letter</span>
            </div>
            <div class="card" onclick="openBox('why')">
                <span class="icon">✨</span>
                <span class="label">Why I Love You</span>
            </div>
            <div class="card" onclick="openBox('marry')">
                <span class="icon">💍</span>
                <span class="label">A Secret Question</span>
            </div>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="overlay-content" id="dynamic-content"></div>
        <div style="text-align: center;">
            <button class="back-btn" onclick="closeBox()">Back</button>
        </div>
    </div>

    <script>
        const data = {
            memories: `<h2>Beautiful Memories</h2><p>Remember when we first met?<br>That time we laughed until it hurt...<br>Every second with you is a treasure.</p>`,
            letter: `<h2>My Dear...</h2><p style="text-align:left;">I wrote this just for you. You've changed my life in ways I can't describe...</p>`,
            why: `<h2>Why I Love You</h2><ul style="text-align:left;"><li>Your kind heart</li><li>The way you smile at me</li><li>How safe I feel with you</li></ul>`,
            marry: `
                <div class="proposal-box" id="proposalArea">
                    <h2>Will you marry me?</h2>
                    <div class="btn-wrap">
                        <button id="yesBtn" onclick="sayYes()">YES!</button>
                        <button id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No</button>
                    </div>
                </div>
                <div class="success-msg" id="successMsg">
                    <h2>YES! ❤️</h2>
                    <p>You've made me the happiest person alive!</p>
                    <div style="font-size: 60px;">🎉💍✨</div>
                </div>
            `
        };

        function openBox(type) {
            document.getElementById('dynamic-content').innerHTML = data[type];
            document.getElementById('overlay').style.display = 'block';
            if(type === 'marry') {
                // Ensure the No button is reset
                setTimeout(() => {
                    const noBtn = document.getElementById('noBtn');
                    noBtn.style.left = '160px'; 
                    noBtn.style.top = '0px';
                }, 100);
            }
        }

        function closeBox() {
            document.getElementById('overlay').style.display = 'none';
        }

        function moveNo() {
            const btn = document.getElementById('noBtn');
            const x = Math.random() * 150 - 75;
            const y = Math.random() * 150 - 75;
            btn.style.transform = `translate(${x}px, ${y}px)`;
        }

        function sayYes() {
            document.getElementById('proposalArea').style.display = 'none';
            document.getElementById('successMsg').style.display = 'block';
        }
    </script>
</body>
</html>
